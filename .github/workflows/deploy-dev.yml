name: Deploy dev

# Merging a pull request into main builds the site and publishes it to
# dev.safepark.app (S3 and CloudFront, made by safepark-infra's website/dev),
# so changes can be checked before they go to safepark.app from release.
#
# The dev build:
#   - is noindex (robots.txt blocks everything; CloudFront adds X-Robots-Tag),
#   - sends its forms to the dev backend, so test enquiries never reach prod,
#   - links to the dev map.
#
# Repository variables:
#   AWS_DEV_DEPLOY_ROLE_ARN  safepark-github-website-dev (safepark-infra aws/bootstrap)
#   DEV_DISTRIBUTION_ID      dev.safepark.app's distribution (safepark-infra website/dev output)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # No GitHub environment here: with one, the OIDC subject becomes
    # "environment:dev", and the AWS role trusts only "ref:refs/heads/main".
    env:
      SITE_URL: https://dev.safepark.app
      PUBLIC_ENQUIRY_URL: https://devapiv2.safepark.app/enquiry
      PUBLIC_MAP_URL: https://devmap.safepark.app
      BUCKET: safepark-dev-website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Upload
        run: |
          # Hashed assets never change; everything else is checked on each visit.
          aws s3 sync dist/_astro "s3://$BUCKET/_astro" --delete \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist "s3://$BUCKET" --delete --exclude "_astro/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Clear the CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.DEV_DISTRIBUTION_ID }}" --paths '/*'
